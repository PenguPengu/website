<script>
  // GitHub Pages has no server-side routing — any URL that isn't a real
  // static file (e.g. underwayco.com/mk-4-deck-bollard) lands here instead.
  // Capture what was actually requested and hand it to the real app so its
  // client-side router can resolve it (a product, a partner, a known page,
  // or a genuine "not found") — see resolveRedirectParam() in index.html.
  //
  // NOTE: this file can only be tested once it's actually deployed to a real
  // server (GitHub Pages, or anywhere else) — opening it directly as a local
  // file does nothing useful, since there's no server there to 404 in the
  // first place.
  //
  // pathSegmentsToKeep: how many leading path segments are NOT part of your
  // app's own routing, just set to 0 if you're serving from a domain root
  // (a custom domain like underwayco.com, or username.github.io itself) —
  // set to 1 if you're testing on a GitHub *project* page URL before
  // attaching a custom domain (username.github.io/your-repo-name/...),
  // since that first segment is the repo name, not a page to route to.
  var pathSegmentsToKeep = 0;

  var loc = window.location;
  var segments = loc.pathname.split('/').slice(1);
  var basePath = '/' + segments.slice(0, pathSegmentsToKeep).join('/') + (pathSegmentsToKeep ? '/' : '');
  var appPath = '/' + segments.slice(pathSegmentsToKeep).join('/') + loc.search + loc.hash;
  location.replace(basePath + '?redirect=' + encodeURIComponent(appPath));
</script>
