<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Underway</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --navy:#19293a;
  --cream:#f7efe6;
  --gold:#c9a84c;
  --rust:#b84c2e;
  --mid:#4a6478;
  --serif:'Playfair Display',serif;
  --mono:'Space Mono',monospace;
}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);
  /* Background transitions between cream and navy */
  background:var(--cream);
  transition:background 1.4s cubic-bezier(.7,0,.3,1);
}
body.dark{background:var(--navy);}

/* ── Grid bg — flips colour with body ── */
.grid-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  transition:opacity 1.4s ease;
}
.grid-light{
  background-image:
    linear-gradient(rgba(25,41,58,.042) 1px,transparent 1px),
    linear-gradient(90deg,rgba(25,41,58,.042) 1px,transparent 1px);
  background-size:120px 120px;
  opacity:1;
}
.grid-dark{
  background-image:
    linear-gradient(rgba(247,239,230,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(247,239,230,.03) 1px,transparent 1px);
  background-size:120px 120px;
  opacity:0;
}
body.dark .grid-light{opacity:0;}
body.dark .grid-dark{opacity:1;}

/* Vignette — barely visible on light, strong on dark */
.vignette{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(8,14,20,.0) 100%);
  transition:background 1.4s ease;
}
body.dark .vignette{
  background:radial-gradient(ellipse at center,transparent 30%,rgba(8,14,20,.75) 100%);
}

/* Noise */
.noise{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.035;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px 200px;}

/* Compass — hidden on light, visible on dark */
.compass-bg{
  position:fixed;right:-160px;bottom:-160px;
  width:560px;height:560px;
  pointer-events:none;z-index:0;
  opacity:0;
  animation:spin-slow 140s linear infinite;
  transition:opacity 1.6s ease;
}
body.dark .compass-bg{opacity:.05;}
@keyframes spin-slow{to{transform:rotate(360deg);}}

/* Scan line — only on dark */
.scanline{
  position:fixed;top:-40%;left:0;right:0;height:40%;
  background:linear-gradient(transparent,rgba(247,239,230,.012) 50%,transparent);
  pointer-events:none;z-index:1;
  opacity:0;
  transition:opacity 1.2s ease;
  animation:scan 10s ease-in-out infinite;
}
body.dark .scanline{opacity:1;}
@keyframes scan{0%{top:-40%;}100%{top:100%;}}

/* HR lines */
.hr-top,.hr-bottom{
  position:fixed;left:0;right:0;height:1px;z-index:2;
  transition:background 1.4s ease;
  background:rgba(25,41,58,.12);
}
body.dark .hr-top,body.dark .hr-bottom{background:rgba(247,239,230,.07);}
.hr-top{top:48px;}.hr-bottom{bottom:48px;}

/* Corner text */
.corner{
  position:fixed;font-size:7px;letter-spacing:.15em;
  font-family:var(--mono);pointer-events:none;z-index:2;
  transition:color 1.4s ease, opacity 1.4s ease;
  color:var(--navy);opacity:.2;
}
body.dark .corner{color:var(--cream);opacity:.16;}
.corner-tl{top:18px;left:22px;}
.corner-tr{top:18px;right:22px;text-align:right;}
.corner-bl{bottom:18px;left:22px;}
.corner-br{bottom:18px;right:22px;text-align:right;}

/* ── Frames ── */
.frame{
  position:absolute;inset:0;z-index:3;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:0 40px;
  opacity:0;pointer-events:none;
  transition:opacity .8s ease;
}
.frame.active{opacity:1;pointer-events:auto;}

/* ────── FRAME 1 — BRIGHT ────── */
#frame1{color:var(--navy);}

.f1-logo{margin-bottom:36px;}
.f1-logo svg{width:150px;height:auto;}

.f1-eyebrow{
  font-size:8px;letter-spacing:.45em;text-transform:uppercase;
  color:var(--navy);opacity:.45;
  margin-bottom:18px;min-height:14px;
}

.f1-title{
  font-family:var(--serif);
  font-size:clamp(58px,10vw,100px);
  font-weight:900;line-height:.88;letter-spacing:-.025em;
  color:var(--navy);
}

.f1-sub{
  font-family:var(--serif);font-style:italic;font-weight:400;
  font-size:clamp(22px,3.8vw,40px);
  color:var(--navy);opacity:.38;
  line-height:1.3;margin-top:14px;display:block;min-height:1.4em;
}

.f1-rule{
  width:0;height:1px;background:rgba(25,41,58,.2);
  margin:26px auto;
  transition:width .8s cubic-bezier(.16,1,.3,1);
}
.f1-rule.expanded{width:52px;}

.f1-tagline{
  font-size:9px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--navy);opacity:.3;
  min-height:14px;
}

/* ────── FRAME 2 — LIGHT "TRANSMISSION" ────── */
#frame2{color:var(--navy);}

.f2-transmission{
  font-family:var(--serif);
  font-size:clamp(36px,6vw,72px);
  font-weight:900;line-height:1.0;
  letter-spacing:-.02em;
  color:var(--navy);
  min-height:1.2em;
}
.f2-transmission em{
  font-style:italic;font-weight:400;opacity:.35;
}
.f2-sub{
  font-size:9px;letter-spacing:.4em;text-transform:uppercase;
  color:var(--navy);opacity:.25;
  margin-top:20px;min-height:14px;
}
.f2-blink-row{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:28px;opacity:0;transition:opacity .5s ease;
}
.f2-blink-row.show{opacity:1;}
.f2-blink-dot{
  width:5px;height:5px;border-radius:50%;background:var(--navy);opacity:.2;
  animation:pulse-dot 1.2s ease-in-out infinite;
}
.f2-blink-dot:nth-child(2){animation-delay:.2s;}
.f2-blink-dot:nth-child(3){animation-delay:.4s;}
@keyframes pulse-dot{0%,100%{opacity:.15;transform:scale(1);}50%{opacity:.5;transform:scale(1.4);}}

/* ────── FRAME 3 — DARK ────── */
#frame3{color:var(--cream);}

.f3-inner{display:flex;flex-direction:column;align-items:center;gap:28px;}

.f3-overline{
  font-size:7px;letter-spacing:.5em;text-transform:uppercase;
  color:var(--gold);opacity:0;
  transition:opacity .6s ease;
  min-height:12px;
}
.f3-overline.show{opacity:.65;}

.f3-title{
  font-family:var(--serif);
  font-size:clamp(42px,6.5vw,80px);
  font-weight:900;line-height:1.0;
  letter-spacing:-.02em;
  max-width:640px;min-height:2em;
  color:var(--cream);
}

.f3-rule{width:40px;height:1px;background:rgba(247,239,230,.18);}

.f3-hint{
  font-size:9px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--cream);opacity:.22;min-height:14px;
  font-family:var(--mono);
}

/* Cursor */
.cur{
  display:none;
  width:2px;height:.82em;
  vertical-align:baseline;margin-left:3px;
  animation:blink .9s step-end infinite;
}
.cur-dark{background:var(--gold);}
.cur-light{background:var(--navy);opacity:.5;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

/* ── DRAMATIC TRANSITION OVERLAY ── */
/* A full-screen ink blot that sweeps across during transition */
.ink-overlay{
  position:fixed;inset:0;z-index:50;pointer-events:none;
  /* Clip-path circle that expands from centre */
  background:var(--navy);
  clip-path:circle(0% at 50% 50%);
  transition:clip-path 0s;
}
.ink-overlay.expanding{
  clip-path:circle(150% at 50% 50%);
  transition:clip-path 1.1s cubic-bezier(.7,0,.2,1);
}
.ink-overlay.shrinking{
  clip-path:circle(0% at 50% 50%);
  transition:clip-path 1.0s cubic-bezier(.7,0,.3,1);
}

/* Ticker */
.ticker-wrap{
  position:fixed;bottom:0;left:0;right:0;height:34px;z-index:10;
  overflow:hidden;display:flex;align-items:center;
  transition:border-color 1.4s ease, background 1.4s ease;
  border-top:1px solid rgba(25,41,58,.1);
  background:rgba(247,239,230,.6);
}
body.dark .ticker-wrap{
  border-top-color:rgba(247,239,230,.06);
  background:rgba(8,14,20,.5);
}
.ticker-track{display:flex;align-items:center;width:max-content;will-change:transform;}
.ticker-item{
  white-space:nowrap;font-size:7.5px;letter-spacing:.28em;text-transform:uppercase;
  padding:0 38px;
  transition:color 1.4s ease, border-color 1.4s ease;
  color:rgba(25,41,58,.3);
  border-right:1px solid rgba(25,41,58,.1);
}
body.dark .ticker-item{color:rgba(247,239,230,.2);border-right-color:rgba(247,239,230,.06);}
.ticker-item span{
  margin-right:10px;
  color:var(--mid);
  transition:color 1.4s ease;
}
body.dark .ticker-item span{color:var(--gold);opacity:.5;}

@media(max-width:540px){
  .f1-title{font-size:clamp(44px,13vw,68px);}
  .f1-sub{font-size:clamp(18px,5vw,28px);}
  .f2-transmission{font-size:clamp(26px,9vw,48px);}
  .f3-title{font-size:clamp(28px,8vw,52px);}
  .corner-tr,.corner-br{display:none;}
}
</style>
</head>
<body>

<div class="grid-bg grid-light"></div>
<div class="grid-bg grid-dark"></div>
<div class="vignette"></div>
<div class="noise"></div>

<div class="ink-overlay" id="ink"></div>

<svg class="compass-bg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" fill="none">
  <circle cx="200" cy="200" r="190" stroke="#f7efe6" stroke-width=".5"/>
  <circle cx="200" cy="200" r="148" stroke="#f7efe6" stroke-width=".35"/>
  <circle cx="200" cy="200" r="78" stroke="#f7efe6" stroke-width=".35"/>
  <line x1="200" y1="10" x2="200" y2="390" stroke="#f7efe6" stroke-width=".4"/>
  <line x1="10" y1="200" x2="390" y2="200" stroke="#f7efe6" stroke-width=".4"/>
  <line x1="55" y1="55" x2="345" y2="345" stroke="#f7efe6" stroke-width=".25"/>
  <line x1="345" y1="55" x2="55" y2="345" stroke="#f7efe6" stroke-width=".25"/>
  <polygon points="200,10 194,48 200,36 206,48" fill="#f7efe6"/>
  <circle cx="200" cy="200" r="5" fill="#f7efe6"/>

<!-- FRAME 1 — BRIGHT -->
<div class="frame active" id="frame1">
  <div class="f1-logo">
    <svg viewBox="0 0 620.05 279.02" xmlns="http://www.w3.org/2000/svg">
      <path fill="#19293a" d="M222.97,0c29,.88,36.01,40.65,7.36,49.68-3.83,1.28-4.69,2.68-3.95,6.7,6.46,35.11,34.25,62.45,69.53,67.51,45.68,8.64,89.78-21.32,98.25-67.3.85-3.81.36-5.44-3.8-6.68-12.92-3.84-19.48-13.45-18.59-26.07,1.02-14.35,11.59-23.71,27.53-23.79,26.16-.12,52.33-.02,78.49.12,23.99.13,47.98.48,71.97.64,35.89-.81,35.03,51.73.86,51.53-28.03,1.42-67.24-2.93-74.92,32.29-4.78,18.26-7.14,36.93-7.98,55.74-2.34,25.14-4.3,59.04,25.22,67.91,1.59-.3,1.89-1.32,2.33-2.19,3.46-6.85,9.34-9.77,16.69-9.9,17.32,1.51,49.77-8.27,49.65,18.24q.02,8.42,8.56,8.45c12.5.02,25-.01,37.5.04,19.1-1.13,9.8,23.16,11.98,34.94,1.02,11.46-58.48,16.36-69.13,18.66-65.83,7.05-131.68-2.61-197.25-7.99-70.42-6.58-141.14-12.84-211.92-9.77-46.17.16-91.84,8.64-137.11,14.65-2.61-.79-3.89-2.11-3.88-4.93-1.05-59.9-3.37-43.3,52.49-45.49,14.19.79-4.29-27.31,26.74-26.89,16.51,1.42,38.32-5.9,47.47,12.31,43.21-11.37,23.1-86.72,18.79-119.39-6.32-39.15-45.21-35.6-76.48-36.75-20.95.71-33.42-25.09-20.74-41.65C53.54,3.93,60.59,1.02,68.55.95,119.87.52,171.19.28,222.97,0Z"/>

  <div class="f1-eyebrow"><span id="f1eb"></span><span class="cur cur-light" id="cur1"></span></div>

<!-- FRAME 2 — LIGHT "TRANSMISSION" -->
<div class="frame" id="frame2">

  <div class="f2-sub" id="f2sub"></div>

<div class="frame" id="frame3">
  <div class="f3-inner">

    <div class="f3-rule"></div>
    <div class="f3-hint" id="f3h"></div>
  </div>
</div>

<div class="ticker-wrap"><div class="ticker-track" id="ticker-track"></div></div>

<script>
// ── Type helper ───────────────────────────────────────────────────────────────
function type(el, text, speed, cb) {
  el.textContent = '';
  var i = 0;
  (function step() {
    el.textContent = text.slice(0, i++);
    if (i <= text.length) setTimeout(step, speed);
    else if (cb) setTimeout(cb, 0);
  })();
}

function showCur(el) { el.style.display = 'inline-block'; }
function hideCur(el, delay) { setTimeout(function(){ el.style.display = 'none'; }, delay || 0); }

// ── Elements ──────────────────────────────────────────────────────────────────
var body   = document.body;
var ink    = document.getElementById('ink');
var f1eb   = document.getElementById('f1eb');
var f1t    = document.getElementById('f1t');
var f1s    = document.getElementById('f1s');
var f1rule = document.getElementById('f1rule');
var f1tag  = document.getElementById('f1tag');
var cur1   = document.getElementById('cur1');
var f2tx   = document.getElementById('f2tx');
var f2sub  = document.getElementById('f2sub');
var f2dots = document.getElementById('f2dots');
var f3over = document.getElementById('f3over');
var f3t    = document.getElementById('f3t');
var f3h    = document.getElementById('f3h');
var cornerStatus = document.getElementById('corner-status');

var HOLD1 = 2400;
var HOLD2 = 1800;
var HOLD3 = 3200;

// ── Frame 1 ───────────────────────────────────────────────────────────────────
function playFrame1(onDone) {
  f1eb.textContent = ''; f1t.textContent = ''; f1s.textContent = ''; f1tag.textContent = '';
  f1rule.classList.remove('expanded');
  cur1.style.display = 'none';
  cornerStatus.textContent = 'MK-II';

  document.getElementById('frame1').classList.add('active');
  document.getElementById('frame2').classList.remove('active');
  document.getElementById('frame3').classList.remove('active');

  setTimeout(function() {
    showCur(cur1);
    type(f1eb, 'Marine · Industrial · Equipment', 36, function() {
      hideCur(cur1, 380);
      setTimeout(function() {
        showCur(cur1);
        type(f1t, 'UNDERWAY', 74, function() {
          hideCur(cur1, 220);
          setTimeout(function() {
            showCur(cur1);
            type(f1s, 'built for the long haul.', 46, function() {
              hideCur(cur1, 300);
              setTimeout(function() {
                f1rule.classList.add('expanded');
                setTimeout(onDone, HOLD1);
              }, 200);
            });
          }, 300);
        });
      }, 340);
    });
  }, 250);
}

// ── Frame 2 — light "Transmission incoming" ───────────────────────────────────
function playFrame2(onDone) {
  f2tx.textContent = ''; f2sub.textContent = '';
  f2dots.classList.remove('show');
  cur1.style.display = 'none';
  cornerStatus.textContent = 'STANDBY';

  document.getElementById('frame1').classList.remove('active');
  document.getElementById('frame2').classList.add('active');
  document.getElementById('frame3').classList.remove('active');

  setTimeout(function() {
    showCur(cur1);
    type(f2tx, 'Transmission', 68, function() {
      hideCur(cur1, 180);
      setTimeout(function() {
        showCur(cur1);
        type(f2tx, 'Transmission incoming.', 68, function() {
          hideCur(cur1, 300);
          setTimeout(function() {
            showCur(cur1);
            type(f2sub, 'Signal acquired — stand by', 38, function() {
              hideCur(cur1, 200);
              setTimeout(function() {
                f2dots.classList.add('show');
                setTimeout(onDone, HOLD2);
              }, 200);
            });
          }, 300);
        });
      }, 500);
    });
  }, 300);
}

// ── Ink to dark ───────────────────────────────────────────────────────────────
function inkToDark(onMid, onDone) {
  ink.style.background = 'var(--navy)';
  ink.className = 'ink-overlay expanding';
  setTimeout(function() {
    body.classList.add('dark');
    if (onMid) onMid();
    setTimeout(function() {
      ink.className = 'ink-overlay shrinking';
      setTimeout(function() {
        ink.className = 'ink-overlay';
        if (onDone) onDone();
      }, 1050);
    }, 180);
  }, 1100);
}

// ── Ink to light ──────────────────────────────────────────────────────────────
function inkToLight(onMid, onDone) {
  ink.style.background = 'var(--cream)';
  ink.className = 'ink-overlay expanding';
  setTimeout(function() {
    body.classList.remove('dark');
    if (onMid) onMid();
    setTimeout(function() {
      ink.className = 'ink-overlay shrinking';
      setTimeout(function() {
        ink.className = 'ink-overlay';
        ink.style.background = 'var(--navy)';
        if (onDone) onDone();
      }, 1050);
    }, 180);
  }, 1100);
}

// ── Frame 3 — dark ───────────────────────────────────────────────────────────
function playFrame3(onDone) {
  f3over.classList.remove('show');
  f3t.textContent = ''; f3h.textContent = '';
  cornerStatus.textContent = 'SOON';

  document.getElementById('frame1').classList.remove('active');
  document.getElementById('frame2').classList.remove('active');
  document.getElementById('frame3').classList.add('active');

  setTimeout(function() {
    f3over.classList.add('show');
    setTimeout(function() {
      type(f3t, 'Something is coming.', 72, function() {
        setTimeout(function() {
          // Hint: redacted URL — clearly a website, name hidden
          type(f3h, '█ █ █ █ █ █ █  .co  ·  watch this space', 38, function() {
            setTimeout(onDone, HOLD3);
          });
        }, 500);
      });
    }, 600);
  }, 300);
}

// ── Main loop ─────────────────────────────────────────────────────────────────
function loop() {
  playFrame1(function() {
    playFrame2(function() {
      inkToDark(null, function() {
        playFrame3(function() {
          inkToLight(null, function() {
            loop();
          });
        });
      });
    });
  });
}

loop();

// ── Ticker ────────────────────────────────────────────────────────────────────
(function() {
  var items = [
    ['Marine',      'Built for the Long Haul'],
    ['Industrial',  'Professional-grade builds'],
    ['Est. 2021',   'Four years in the making'],
    ['Coming Soon', 'Something is underway'],
    ['Stormworks',  'Expedition · Yacht · Infrastructure'],
    ["59°54'N",     "10°44'E"],
  ];
  var track = document.getElementById('ticker-track');
  for (var r = 0; r < 6; r++) {
    items.forEach(function(item) {
      var div = document.createElement('div');
      div.className = 'ticker-item';
      div.innerHTML = '<span>' + item[0] + '</span>' + item[1];
      track.appendChild(div);
    });
  }
  var pos = 0, halfW = 0;
  (function tick() {
    pos += 0.55;
    if (!halfW || pos >= halfW) { halfW = track.scrollWidth / 2; if (pos >= halfW) pos -= halfW; }
    track.style.transform = 'translateX(-' + pos + 'px)';
    requestAnimationFrame(tick);
  })();
})();

// ── Secret access ─────────────────────────────────────────────────────────────
// Method 1: URL — visit /?key=bollard   (change 'bollard' to whatever you want)
// Method 2: Type the passphrase anywhere on the page — same word
// Both redirect to /site.html (rename your main index to site.html)

var SECRET     = 'bollard';          // ← change this passphrase
var DEST       = '/site.html';       // ← change to wherever your main site lives

// Method 1: query param  ?key=bollard
(function() {
  var params = new URLSearchParams(window.location.search);
  if (params.get('key') === SECRET) {
    // Store in session so the main site knows it's authorised
    sessionStorage.setItem('uw_auth', '1');
    window.location.replace(DEST);
  }
})();

// Method 2: type the passphrase — keys accumulate, resets after 2s of inactivity
(function() {
  var buffer = '';
  var timer  = null;
  document.addEventListener('keydown', function(e) {
    // Ignore modifier-only keys
    if (e.key.length !== 1) return;
    buffer += e.key.toLowerCase();
    // Keep only the last N chars (length of secret)
    if (buffer.length > SECRET.length) buffer = buffer.slice(-SECRET.length);
    clearTimeout(timer);
    timer = setTimeout(function() { buffer = ''; }, 2000);
    if (buffer === SECRET) {
      sessionStorage.setItem('uw_auth', '1');
      window.location.href = DEST;
    }
  });
})();</script>
